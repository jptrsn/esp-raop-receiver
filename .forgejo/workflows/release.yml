name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release'
        required: true

jobs:
  build:
    runs-on: codeberg-medium
    strategy:
      matrix:
        target: [esp32, esp32s3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: ${{ matrix.target }}
          command: idf.py build

      - name: Rename binary
        run: cp build/esp-airsync.bin esp-airsync-${{ matrix.target }}.bin

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: esp-airsync-${{ matrix.target }}.bin

  release:
    needs: build
    runs-on: codeberg-medium

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release and upload assets
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          TAG: ${{ forgejo.ref_name != '' && forgejo.ref_name || inputs.tag }}
        run: |
          # Create the release
          RELEASE=$(curl -s -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"$TAG\", \"draft\": false}" \
            https://codeberg.org/api/v1/repos/Edu_Coder/esp-airsync/releases)

          RELEASE_ID=$(echo $RELEASE | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

          # Upload esp32 binary
          curl -s -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @firmware-esp32/esp-airsync-esp32.bin \
            "https://codeberg.org/api/v1/repos/Edu_Coder/esp-airsync/releases/$RELEASE_ID/assets?name=esp-airsync-esp32.bin"

          # Upload esp32s3 binary
          curl -s -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @firmware-esp32s3/esp-airsync-esp32s3.bin \
            "https://codeberg.org/api/v1/repos/Edu_Coder/esp-airsync/releases/$RELEASE_ID/assets?name=esp-airsync-esp32s3.bin"