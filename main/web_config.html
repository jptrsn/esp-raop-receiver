<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP AirSync Configuration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0);     opacity: 1; }
        }
        .banner-enter {
            animation: slideDown 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Restart banner (hidden until a save occurs) -->
    <div id="restart-banner" class="hidden fixed top-0 left-0 right-0 z-50 bg-amber-500 text-white shadow-lg">
        <div class="max-w-2xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
                <span class="font-medium">Changes saved. A restart is required to apply them.</span>
            </div>
            <button onclick="restartDevice()"
                    class="bg-white text-amber-600 font-semibold px-4 py-2 rounded-lg hover:bg-amber-50 transition-colors">
                Restart Now
            </button>
        </div>
    </div>

    <div class="max-w-2xl mx-auto px-4 py-10">
        <h1 class="text-2xl font-bold text-gray-800 mb-8">ESP AirSync Configuration</h1>

        <!-- WiFi Section -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-1">WiFi</h2>
            <form onsubmit="saveSection(event, '/save/wifi')">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-600 mb-1">SSID</label>
                    <input type="text" name="ssid" required
                        value="{{CURRENT_SSID}}"
                        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
                    <input type="password" name="password" required
                           class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <button type="submit"
                        class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">
                    Save WiFi
                </button>
            </form>
        </div>

        <!-- Device Section -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-5">Device</h2>
            <form onsubmit="saveSection(event, '/save/device')">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-600 mb-1">Device Name</label>
                    <input type="text" name="device_name"
                           value="{{CURRENT_DEVICE_NAME}}"
                           placeholder="{{DEFAULT_DEVICE_NAME}}"
                           maxlength="31"
                           pattern="[A-Za-z0-9\-]+"
                           title="Alphanumeric characters and hyphens only"
                           class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <p class="text-xs text-gray-400 mt-1">Alphanumeric and hyphens only, 31 characters max.</p>
                </div>
                <button type="submit"
                        class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">
                    Save Device
                </button>
            </form>
        </div>

        <!-- Audio Section -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-5">Audio</h2>
            <form onsubmit="saveSection(event, '/save/audio')">
                <div class="grid grid-cols-3 gap-4 mb-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">BCK Pin</label>
                        <input type="number" name="bck_pin" required
                               value="{{BCK_PIN}}"
                               min="0" max="39"
                               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">LCK Pin</label>
                        <input type="number" name="ws_pin" required
                               value="{{WS_PIN}}"
                               min="0" max="39"
                               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">DIN Pin</label>
                        <input type="number" name="dout_pin" required
                               value="{{DOUT_PIN}}"
                               min="0" max="39"
                               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                </div>
                <button type="submit"
                        class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">
                    Save Audio
                </button>
            </form>
        </div>
    </div>

    <script>
        function showRestartBanner() {
            const banner = document.getElementById('restart-banner');
            if (banner.classList.contains('hidden')) {
                banner.classList.remove('hidden');
                banner.classList.add('banner-enter');
            }
        }

        async function saveSection(event, endpoint) {
            event.preventDefault();
            const form = event.target;
            const data = new URLSearchParams(new FormData(form));

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: data.toString()
                });

                if (response.ok) {
                    showRestartBanner();
                } else {
                    alert('Save failed. Please try again.');
                }
            } catch (err) {
                alert('Error communicating with device.');
            }
        }

        async function restartDevice() {
            try {
                await fetch('/restart', { method: 'POST' });
            } catch (_) {
                // Device is restarting, connection will drop — this is expected
            }
            document.getElementById('restart-banner').innerHTML =
                '<div class="max-w-2xl mx-auto px-6 py-4 text-center font-medium">Restarting device...</div>';
        }
    </script>

</body>
</html>
